name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: El HTML de la raíz coincide con la compilación y el árbol queda limpio
        working-directory: .
        run: |
          cmp ctem-nexus.html frontend/dist/ctem-nexus.html
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "La compilación modifica ficheros versionados: ejecuta npm run build y súbelos."; exit 1; }

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest

  navegador:
    # e2e (flujos, CSP, red bloqueada) y accesibilidad (axe-core, WCAG 2.2 AA) sobre el HTML autocontenido.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r tests/requirements.txt && python -m playwright install --with-deps chromium
      - run: python tests/e2e_app.py
      - run: python tests/a11y_app.py
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informes-navegador
          path: tests/artifacts/

