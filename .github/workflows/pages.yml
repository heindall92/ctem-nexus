name: Publicar en GitHub Pages

# Cada push a la rama por defecto pasa las pruebas, reconstruye la interfaz y publica frontend/dist
# (index.html multiarchivo + ctem-nexus.html autocontenido) en la rama gh-pages.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Solo este trabajo escribe, y solo en la rama gh-pages.
    permissions:
      contents: write
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar dist/ en gh-pages
        env:
          SHA: ${{ github.sha }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "Yoandy Ramírez Delgado"
          git config user.email "yoandyramirezdelgado@gmail.com"
          git add -A
          git commit -q -m "Publicar ${SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
