name: Publicar versión

# Al subir una etiqueta vX.Y.Z: pasa las pruebas, compila y crea la release de GitHub con el HTML autocontenido
# adjunto y, como notas, la entrada de esa versión en CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Solo este trabajo escribe, y solo para crear la release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - name: La etiqueta coincide con la versión de package.json
        run: |
          v="$(node -p "require('./frontend/package.json').version")"
          test "v${v}" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con package.json (${v})"; exit 1; }
      - name: Notas desde CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notas.md
          test -s notas.md || { echo "No hay entrada para ${v} en CHANGELOG.md"; exit 1; }
          printf '\n---\nDescarga `ctem-nexus.html` y ábrelo con doble clic: funciona sin servidor ni conexión. Demo en vivo: https://heindall92.github.io/ctem-nexus/\n' >> notas.md
          sha256sum frontend/dist/ctem-nexus.html | awk '{print "\nSHA-256 de ctem-nexus.html: `" $1 "`"}' >> notas.md
      - name: Crear la release con el HTML adjunto
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" frontend/dist/ctem-nexus.html --title "CTEM-Nexus ${GITHUB_REF_NAME}" --notes-file notas.md --verify-tag
